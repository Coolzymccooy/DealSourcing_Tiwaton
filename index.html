<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tiwaton Deal Sourcing</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <!-- Header -->
    <header id="app-header">
        <img src="assets/tiwaton-logo.png" alt="Tiwaton" class="logo-icon-img" />

        <div class="header-text">
            <h1>Deal Sourcing</h1>
            <p>
                Find and analyse investment opportunities · Buy-to-Let · Flip · Renovate &amp; Sell
            </p>
        </div>
        <nav class="main-nav">
            <a href="index.html#deals">Deals</a>
            <a href="about.html">About</a>
            <a href="what-we-do.html">What We Do</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Main content -->
    <main>
        <!-- Deals section (filters + cards) -->
        <section id="deals">
            <!-- Filters -->
            <section id="filters" aria-label="Property Filters">
                <div class="filter-group">
                    <label for="filter-strategy">Investment Strategy</label>
                    <select id="filter-strategy">
                        <option value="all">All Strategies</option>
                        <option value="buy-to-let">Buy-to-Let</option>
                        <option value="buy-to-flip">Buy-to-Flip</option>
                        <option value="renovate-sell">Renovate &amp; Sell</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filter-location">Location</label>
                    <select id="filter-location">
                        <option value="all">All Locations</option>
                        <option value="Manchester">Manchester</option>
                        <option value="London">London</option>
                        <option value="Birmingham">Birmingham</option>
                        <option value="Leeds">Leeds</option>
                        <option value="Liverpool">Liverpool</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filter-min-roi">Min ROI %</label>
                    <input type="number"
                           id="filter-min-roi"
                           placeholder="e.g. 6"
                           min="0"
                           step="0.5" />
                </div>

                <div class="filter-group">
                    <label for="filter-max-price">Max Price (£)</label>
                    <input type="number"
                           id="filter-max-price"
                           placeholder="e.g. 300000"
                           min="0"
                           step="5000" />
                </div>

                <div class="filter-group">
                    <label for="sort-by">Sort By</label>
                    <select id="sort-by">
                        <option value="none">Default</option>
                        <option value="score-desc">Score (High → Low)</option>
                        <option value="roi-desc">ROI (High → Low)</option>
                        <option value="price-asc">Price (Low → High)</option>
                        <option value="price-desc">Price (High → Low)</option>
                    </select>
                </div>


                <button id="clear-filters" aria-label="Clear All Filters">Clear</button>
            </section>

            <!-- Property cards -->
            <section id="property-list"
                     aria-live="polite"
                     aria-label="Available Properties">
                <!-- Cards injected by app.js -->
            </section>
        </section>

    </main>
    <!-- Calculator Modal -->
    <div class="modal-backdrop"
         id="calculator-modal"
         role="dialog"
         aria-modal="true"
         aria-labelledby="calculator-title">
        <div class="calculator-modal">
            <div class="modal-header">
                <h2 id="calculator-title">Investment Calculator</h2>
                <button class="close-btn" aria-label="Close Calculator">&times;</button>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <div class="tab active" data-tab="buy-to-let">Buy-to-Let</div>
                <div class="tab" data-tab="buy-to-flip">Buy-to-Flip</div>
                <div class="tab" data-tab="renovate-sell">Renovate &amp; Sell</div>
            </div>

            <!-- Subtitle -->
            <h3 id="calculator-subtitle" class="calc-subtitle">Buy-to-Let Calculator</h3>
            <a id="deal-external-link"
               class="deal-link"
               href="#"
               target="_blank"
               rel="noopener">
                View full listing &rarr;
            </a>


            <!-- Dynamic form -->
            <form id="calculator-form">
                <!-- Fields injected by app.js -->
            </form>

            <!-- Dynamic result panel -->
            <div id="calculator-result" class="calc-result-panel">
                <!-- Summary rows injected by app.js -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer id="app-footer">
        <div class="footer-inner">
            <span>© 2025 Tiwaton Deal Sourcing</span>
            <span class="footer-right">Built for UK property investors</span>
        </div>
    </footer>

    <!-- App script -->
    <script src="js/app.js"></script>
</body>
</html>
